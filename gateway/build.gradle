configurations.all {
    exclude group: 'org.springframework.boot', module: 'spring-boot-starter-data-jpa'
    exclude group: 'org.springframework.boot', module: 'spring-boot-starter-kafka'
    exclude group: 'org.springframework.boot', module: 'spring-boot-starter-webmvc'
    exclude group: 'org.postgresql', module: 'postgresql'
    exclude group: 'org.springdoc', module: 'springdoc-openapi-starter-webmvc-ui'
}

dependencies {
    implementation project(':security')
    implementation project(':common')
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // spring-security-webflux가 spring-security-web에 의존하므로 WebFlux 앱임에도 서블릿 API를 런타임에 제공해야함
    runtimeOnly 'jakarta.servlet:jakarta.servlet-api'

    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
}
