# Ingress 설정 (Traefik + SSL)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: resello-ingress
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    traefik.ingress.kubernetes.io/router.entrypoints: web, websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: default-redirect-https@kubernetescrd
spec:
  tls:
    - hosts:
        - api.resello.co.kr
        - www.resello.co.kr
      secretName: resello-tls
  rules:
    - host: api.resello.co.kr
      http:
        paths:
          - path: /api/v1/users
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 8080

          - path: /api/v1/products
            pathType: Prefix
            backend:
              service:
                name: product-service
                port:
                  number: 8080

          - path: /api/v1/cash
            pathType: Prefix
            backend:
              service:
                name: cash-service
                port:
                  number: 8080

          - path: /api/v1/notifications
            pathType: Prefix
            backend:
              service:
                name: notification-service
                port:
                  number: 8080

          - path: /api/v1/price-alerts
            pathType: Prefix
            backend:
              service:
                name: notification-service
                port:
                  number: 8080

          - path: /api/v1/chat
            pathType: Prefix
            backend:
              service:
                name: chat-service
                port:
                  number: 8080

          - path: /api/v1/market
            pathType: Prefix
            backend:
              service:
                name: market-service
                port:
                  number: 8080

          - path: /api/v1/admin/settlements
            pathType: Prefix
            backend:
              service:
                name: settlement-service
                port:
                  number: 8080

    # Frontend (Vercel 사용 시 이 설정은 무시됨)
    - host: www.resello.co.kr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 3000
